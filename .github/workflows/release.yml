name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cli:
    name: Build CLI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test CLI and core
        run: cargo test --locked -p gpu-monitor-core -p gpu-monitor-runtime -p gpu-monitor-cli
      - name: Build CLI
        run: cargo build --locked --release --bin gpu-monitor
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-monitor-cli
          path: target/release/gpu-monitor
          if-no-files-found: error

  build-gui:
    name: Build GUI packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/gpu-monitor-gui/src-web/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        working-directory: crates/gpu-monitor-gui/src-web
        run: npm ci
      - name: Test frontend
        working-directory: crates/gpu-monitor-gui/src-web
        run: npm test
      - name: Test backend
        run: cargo test --locked -p gpu-monitor-core -p gpu-monitor-runtime -p gpu-monitor-gui
      - name: Build Tauri app (also builds frontend)
        working-directory: crates/gpu-monitor-gui
        run: npx --yes --package @tauri-apps/cli@2.11.3 tauri build --ci -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-monitor-gui-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-monitor-gui-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish-release:
    name: Publish release
    needs: [build-cli, build-gui]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/gpu-monitor-cli/gpu-monitor
            artifacts/gpu-monitor-gui-deb/*.deb
            artifacts/gpu-monitor-gui-appimage/*.AppImage
          fail_on_unmatched_files: true
          generate_release_notes: true
